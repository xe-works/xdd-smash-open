name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          # 22, not the 20 in package.json engines: `node --test` only expands
          # the glob patterns in the test script from 21 on.
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run coverage
