name: CodeQL

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze:
    # Code scanning is free on public repositories and needs Advanced Security
    # on private ones, so this would fail on the private mirror rather than skip.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
